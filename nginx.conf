server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El index.html nunca se guarda sin revalidar: es el que apunta a los JS/CSS
    # del build actual. Sin este header el navegador lo cacheaba por su cuenta
    # (según su antigüedad) y tras un deploy seguía cargando la versión anterior.
    # Las rutas de la SPA caen aquí por el try_files de `location /`.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Los archivos de /assets llevan el hash del contenido en el nombre: un
    # build nuevo usa nombres nuevos, así que se pueden guardar para siempre.
    # Uno que no existe da 404 sin ese header (y no el index.html, que el
    # navegador leería como JS).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
