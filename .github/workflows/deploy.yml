name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Fijado para no heredar el salto de ubuntu-latest a Ubuntu 26 sin probarlo.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Necesario para poder diffear contra el commit/base anterior en el
          # paso de "archivos modificados" de más abajo.
          fetch-depth: 0

      # Misma versión que la imagen de producción (Dockerfile: node:22.23.4).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      # Fija la versión de npm que generó package-lock.json. "npm ci" es
      # estricto entre versiones de npm para paquetes opcionales por
      # plataforma (ej. @emnapi/* de lightningcss) — un lockfile escrito
      # con una versión distinta de npm puede fallar con "Missing: X from
      # lock file" aunque el lockfile sea válido.
      - name: Fijar versión de npm
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci

      # Detecta los .js/.jsx tocados por este PR/push. Hay deuda de lint
      # preexistente en el resto del repo (ver step "Lint completo" abajo),
      # así que el gate bloqueante solo aplica a lo que se está modificando.
      - name: Determinar archivos modificados
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- '*.js' '*.jsx' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Lint de archivos modificados (bloqueante)
        if: steps.changed.outputs.files != ''
        run: npx eslint ${{ steps.changed.outputs.files }}

      # No bloqueante: deuda de lint preexistente en archivos no tocados por
      # este cambio (mismo criterio que ruff en el backend). Sirve como
      # radar de la deuda total sin frenar PRs que no la tocan.
      - name: Lint completo (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Run tests (con cobertura)
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Fijado para no heredar el salto de ubuntu-latest a Ubuntu 26 sin probarlo.
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: gestflow-frontend-deploy
      cancel-in-progress: false
    # Configurables desde Settings > Environments > production > Variables,
    # para poder mover el deploy a otro nodo de la tailnet sin tocar el YAML.
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '100.109.30.79' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'matias' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://aunaro.mardev.cl' }}

    # El build no se hace en el runner: aunaro construye la imagen del
    # frontend desde su checkout en /opt/mardev/src/Gestflow-Frontend vía
    # docker compose (el job "test" ya validó que el build compila).
    steps:
      # Solo para tener scripts/deploy-remote.sh disponible en el runner.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # El server solo es alcanzable dentro de la tailnet. Si existen los
      # secrets TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET se usa el cliente OAuth
      # (recomendado, no vence) con los tags de vars.TS_TAGS; si no, la auth
      # key TS_AUTHKEY.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TS_OAUTH_SECRET != '' && (vars.TS_TAGS || 'tag:ci') || '' }}
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Set up deploy SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Fuerza el establecimiento de la ruta en la tailnet antes de usar SSH
      # — justo después de "tailscale up" la ruta puede no estar lista aún.
      # --until-direct=false: un pong por relay DERP ya es ruta válida (SSH
      # funciona igual por el relay). Sin el flag, `tailscale ping` sale con 1
      # ("direct connection not established") aunque el nodo respondió.
      # Si el nodo no responde, falla aquí con diagnóstico en vez de dejar
      # que ssh-keyscan agote reintentos sin explicar por qué.
      - name: Wait for tailnet route
        run: |
          for i in 1 2 3 4 5 6; do
            if tailscale ping -c 1 --until-direct=false --timeout 5s "$DEPLOY_HOST"; then
              echo "tailnet ok hacia $DEPLOY_HOST (intento $i)"
              if nc -zv -w 10 "$DEPLOY_HOST" 22; then
                exit 0
              fi
              echo "::error::$DEPLOY_HOST responde por la tailnet pero el puerto 22 no acepta conexiones (sshd caído o ACL de Tailscale bloqueando :22)"
              exit 1
            fi
            echo "tailscale ping intento $i falló, reintentando en 5s"
            sleep 5
          done
          echo "::group::tailscale status"
          tailscale status || true
          echo "::endgroup::"
          echo "::error::$DEPLOY_HOST no responde por la tailnet. Revisa que el nodo esté online en tailscale status y que el ACL permita al runner llegar a él."
          exit 1

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3 4 5 6; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err && [ -s ~/.ssh/known_hosts ]; then
              echo "ssh-keyscan ok (intento $i)"
              exit 0
            fi
            echo "ssh-keyscan intento $i falló, reintentando en 5s"; cat /tmp/keyscan.err
            sleep 5
          done
          echo "ssh-keyscan agotó los reintentos"; exit 1

      # Ver scripts/deploy-remote.sh: git reset al commit del run, rebuild
      # solo del frontend y rollback automático a la imagen anterior si falla.
      - name: Deploy en el server
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" < scripts/deploy-remote.sh

      - name: Health check
        run: |
          curl -sf -o /dev/null -w "site:%{http_code}\n" "$SITE_URL"
