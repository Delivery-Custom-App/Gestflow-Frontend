services:
  postgres:
    image: postgres:16-alpine
    container_name: gestflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestflow}
      POSTGRES_USER: ${POSTGRES_USER:-gestflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestflow_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gestflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gestflow_postgres_data:
