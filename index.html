<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUNARO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica tema guardado ANTES del render (evita flash y estado obsoleto)
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var root = document.documentElement
          if (t === 'dark') root.classList.add('dark')
          else root.classList.remove('dark')
        } catch (e) {}
      })()
    </script>
<script type="module" src="/src/main.jsx"></script>
  </body>
</html>
